plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    // Icarus (optional compile-time dependency for the apoli:wings compat power type).
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // Accessories (accessory-slot compat backend).
    maven {
        name = "Wispforest"
        url = "https://maven.wispforest.io/releases"
    }
    // Curios (accessory-slot compat backend).
    maven {
        name = "TheIllusiveC4"
        url = "https://maven.theillusivec4.top/"
    }
    // Sinytra — hosts org.sinytra.forgified-fabric-api, a transitive of accessories-neoforge that
    // supplies the Fabric event API (AccessoryChangeCallback) shim on NeoForge.
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }
    // Blay09 mods (Balm + Hardcore Revival) for the revival compat.
    maven {
        name = "TwelveIterations"
        url = "https://maven.twelveiterations.com/repository/maven-public/"
    }
    maven {
        name = "Henkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
    // KubeJS + Rhino (optional compile-time dependency for the apoli:script types and ApoliEvents).
    maven {
        name = "Saps"
        url = "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations {
    // Shipped as plain resources under apoli/runtime/, NOT jarJar: anything under META-INF/jarjar
    // becomes a JPMS module, and a second com.sun.jna module breaks module resolution for every mod.
    voskRuntime { transitive = false }
}

dependencies {
    // Icarus — compiled against, never bundled and not a runtime dependency. The apoli:wings power
    // and its mixins are gated on Icarus being present (ModCompat.ICARUS / IcarusCompatMixinPlugin),
    // so Apoli runs fine without it. NeoForge artifacts ship in the official mappings, so no remap
    // is needed (plain compileOnly). Adjust icarus_version per the Icarus file you target.
    compileOnly "maven.modrinth:icarus:${project.icarus_version}"

    // Figura — compiled against, never bundled. modify_player_model equips Figura avatars; the
    // compat code and its mixin are gated on Figura being present (ModCompat.FIGURA /
    // FiguraCompatMixinPlugin), so Apoli runs fine without it.
    compileOnly "maven.modrinth:figura:${project.figura_version}"


    // Accessories + Curios (compile-only, optional at runtime) — the unified accessory compat types.
    // Gated at runtime by ModCompat / the Accessories facade, so Apoli runs fine with neither present.
    compileOnly "io.wispforest:accessories-neoforge:${project.accessories_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

    // Hardcore Revival + Balm (compile-only, optional at runtime) — the revival compat types.
    // Gated at runtime by ModCompat.HARDCORE_REVIVAL, so Apoli runs fine without them.
    compileOnly "net.blay09.mods:balm-neoforge:${project.balm_version}"
    compileOnly "net.blay09.mods:hardcorerevival-neoforge:${project.hardcore_revival_version}"

    // Simple Voice Chat API — compiled against, optional at runtime. The voicechat compat plugin is
    // only discovered by SVC (via @ForgeVoicechatPlugin) when SVC is installed, so Apoli runs fine
    // without it and the voice_* conditions simply read false.
    // 3D Skin Layers + Ears (compile-only, optional at runtime) — the render powers that recolour or
    // replace the player skin have to reach into these mods, because they draw their own geometry
    // from the raw skin file instead of the vanilla model. Gated by their mixin config plugins.
    compileOnly "maven.modrinth:3dskinlayers:${project.skinlayers_version}"
    compileOnly "maven.modrinth:ears:${project.ears_version}"

    // Pufferfish's Skills (compile-only, optional at runtime) — the skill-tree compat registers the
    // apoli:power / apoli:modify_resource rewards and lets apoli:grant_skill_tree unlock a Skills
    // category. Gated by ModCompat.PUFFISH_SKILLS, so Apoli runs fine without it.
    // Sodium (compile-only, optional at runtime) — Sodium meshes chunks from its own LevelSlice
    // instead of vanilla RenderChunkRegion, so apoli:modify_block_render needs a second hook there.
    // Gated by SodiumCompatMixinPlugin, so Apoli runs fine without it.
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"

    // You're in Grave Danger and GraveStone Mod (compile-only, optional at runtime) — power inventories,
    // keep_inventory and the GraveInscriptions lines on the grave. Gated by ModCompat and GraveCompatMixinPlugin.
    compileOnly "maven.modrinth:yigd:${project.yigd_version}"
    compileOnly "maven.modrinth:gravestone-mod:${project.gravestone_version}"

    compileOnly "maven.modrinth:skills:${project.puffish_skills_version}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    // KubeJS — compiled against, never bundled and not a runtime dependency. The apoli:script types
    // and the ApoliEvents script API are gated on KubeJS being present (ModCompat.KUBEJS), so Apoli
    // runs fine without it and apoli:script simply logs that no backend is installed.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${project.kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${project.rhino_version}"

    // Vosk offline speech. Bundled, but NOT via jarJar — see the voskRuntime configuration above.
    // VoskRuntime unpacks these to <gamedir>/apoli/runtime/ and loads them in an isolated class loader.
    voskRuntime "com.alphacephei:vosk:${project.vosk_version}"
    voskRuntime "net.java.dev.jna:jna:5.7.0"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            // Publish under the loader+MC-qualified coordinate; the jar/neoforge.mods.toml keep mod_version.
            version = project.maven_version
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Ship the A/O License alongside the mod, matching the Fabric builds.
jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }

}


tasks.register('collectVoskRuntime', Copy) {
    from configurations.voskRuntime
    into layout.buildDirectory.dir('voskRuntime')
    rename { it.startsWith('vosk') ? 'vosk.jar' : 'jna.jar' }
}

tasks.named('processResources') {
    dependsOn 'collectVoskRuntime'
    from(layout.buildDirectory.dir('voskRuntime')) {
        into 'apoli/runtime'
    }
}
